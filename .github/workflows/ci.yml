name: CI

# The fast checks only. The slow ones run locally before a merge:
#   pnpm db:up && pnpm db:migrate && pnpm test:int   integration (Postgres, Redis)
#   pnpm smoke                                       Playwright smoke (~45 min under SwiftShader on a CI runner)
#   pnpm art:validate -- --changed                   changed .blend sources (needs Blender)

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: 'true'
    steps:
      # LFS holds ~2 GB of renders; fetch only the models the client serves, so a run stays inside the free bandwidth quota
      - uses: actions/checkout@v5
      - run: git lfs pull --include="packages/client/public/**"
      # before setup-node: it caches pnpm's store when package.json names pnpm, so pnpm must already be on PATH
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - name: Unit and golden tests
        run: pnpm test
      - name: Removed-code gate
        run: pnpm gate:removed
